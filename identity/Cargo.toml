[package]
name = "orvyn-identity"
version = "0.1.0"
edition = "2021"
description = "OrvynID: named NEAR accounts and identity records for Orvyn AI agents"
repository = "https://github.com/OrvynisNear/Orvyn"
readme = "README.md"

# Reproducible build (NEP-330): `cargo near build reproducible-wasm` builds the contract in this
# pinned image from the committed source; SourceScan repeats it to verify the code on chain.
[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.97.1"
image_digest = "sha256:7467038bdddc86484b73b416eeadce926ff59013e128e53dec5a19e1cb4b2234"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.29"

[dev-dependencies]
near-sdk = { version = "5.29", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(near)"] }
